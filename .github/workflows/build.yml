name: Build JOWE MUTANT FX VST3
on:
  push:
  workflow_dispatch:
jobs:
  windows-vst3:
       runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target JoweMutantFX_VST3 --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build" -Filter "*.vst3" -Recurse | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $plugin) { throw "VST3 output not found" }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item $plugin.FullName -Destination "artifacts/" -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: JOWE-MUTANT-FX-Windows-VST3
          path: artifacts/
