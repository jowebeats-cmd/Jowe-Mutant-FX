name: Build JOWE MUTANT FX VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plugins/JoweMutantFX/**'
      - '.github/workflows/build-jowe-mutant.yml'

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download JUCE
        shell: pwsh
        run: |
          git submodule update --init _tools/JUCE

      - name: Prepare isolated plugin directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apc-build-plugins"

          Copy-Item `
            -Path "plugins/JoweMutantFX" `
            -Destination "apc-build-plugins/JoweMutantFX" `
            -Recurse

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-jowe `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DAPC_PLUGINS_DIR=$env:GITHUB_WORKSPACE/apc-build-plugins" `
            -DAPC_ENABLE_CLAP=OFF `
            -DAPC_ENABLE_VISAGE=OFF

      - name: Build JOWE MUTANT FX
        shell: pwsh
        run: |
          cmake --build build-jowe `
            --config Release `
            --target JoweMutantFX_VST3 `
            --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: JOWE-MUTANT-FX-Windows-VST3
          path: build-jowe/**/VST3/**
          if-no-files-found: error
          retention-days: 30
